# Copy this file outside the repository and replace data_root before use.
kind: mercury-data3d

paths:
  data_root: /path/to/exampleMercury_data

input:
  static_dir: DATA_bin
  data_dir: DATA_archive/Step_003532299_Time_7.988853e+01

# auto | fluid | solid | all.  Fluid-only fields (H/Na, E_*) force fluid.
region: auto

# data | solver | both.  `data` computes E_Hall / E_ambipolar / E_generalized from the
# data alone (n_e = n_H + n_Na, no taper).  `solver` swaps them for *_solver, which follow
# the solver's induction EMFs: n_e,eff = sqrt(n_e^2 + ne_hall_floor^2) and, for Hall only,
# the radial taper 0.5 (1 + tanh(2 (r - mid) / (r_max - r_min))).  `both` writes both.
hall_model: both

# Case-specific solver parameters (CASE/setup/3_MHD_Control.txt r_min, r_max; solver ne_hall_floor
# in MercurySolver_Tools.cpp).  Required whenever a *_solver, *_force, hall_taper or *_reg field is written.
solver_model:
  hall_taper_r_min: 1.3
  hall_taper_r_max: 1.7
  ne_hall_floor: 0.01
  # reference_number_density: 4.0e7   # m^-3; default density_ref / particle_mass_H

# none | both | only.  `both` adds a nondimensional <field>_nd twin (SI value /
# solver reference) for every field that has one; `only` writes just the twins.
nondimensional: both

fields:
  - B_induced
  - B_additive
  - B_total
  - J_induced
  - H_density
  - H_velocity
  - H_pressure
  - H_number_density
  - H_temperature
  - H_dynamic_pressure
  - Na_density
  - Na_velocity
  - Na_pressure
  - Na_number_density
  - Na_temperature
  - Na_dynamic_pressure
  - electron_number_density
  - ion_mass_density
  - ion_charge_velocity
  - thermal_pressure
  - dynamic_pressure
  - magnetic_pressure
  - total_pressure
  - plasma_beta
  - E_motional
  - E_Hall
  - E_ambipolar
  - E_generalized
  - electron_number_density_reg
  - hall_taper
  - H_Hall_force
  - Na_Hall_force
  - ion_Hall_force
  - H_ambipolar_force
  - Na_ambipolar_force
  - ion_ambipolar_force

output:
  path: processed/mercury_all_003532299.vtu

runtime:
  memory_budget_gb: 6
  temp_dir: processed/tmp
  keep_temp: false
  verify_readback: false
