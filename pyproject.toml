[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciplot"
version = "0.1.0"
description = "Small, script-driven scientific plotting helpers for CFD data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "scipy>=1.11", "pyvista>=0.43", "vtk>=9.2", "PyYAML>=6.0"]

[project.scripts]
pypost = "sciplot.cli:main"

[tool.setuptools.packages.find]
include = ["sciplot*"]

[tool.setuptools.package-data]
sciplot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
